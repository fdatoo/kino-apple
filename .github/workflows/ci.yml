name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kit-format:
    name: kit-format
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' -print | sort | tail -n 1)"
          if [ -z "$latest_xcode" ]; then
            latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode_15*.app' -print | sort | tail -n 1)"
          fi
          if [ -n "$latest_xcode" ]; then
            sudo xcode-select -s "$latest_xcode" || echo "xcode-select failed; using current default"
          else
            echo "No Xcode_16 or Xcode_15 bundle found; using current default"
          fi
          xcodebuild -version
          swift --version

      - name: Check swift-format
        run: swift format --version

      - name: Check KinoKit formatting
        run: swift format lint --strict --recursive Packages/KinoKit/Sources Packages/KinoKit/Tests

  kit-test:
    name: kit-test
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' -print | sort | tail -n 1)"
          if [ -z "$latest_xcode" ]; then
            latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode_15*.app' -print | sort | tail -n 1)"
          fi
          if [ -n "$latest_xcode" ]; then
            sudo xcode-select -s "$latest_xcode" || echo "xcode-select failed; using current default"
          else
            echo "No Xcode_16 or Xcode_15 bundle found; using current default"
          fi
          xcodebuild -version
          swift --version

      - name: Test KinoKit
        run: swift test --package-path Packages/KinoKit

  kit-coverage:
    name: kit-coverage
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' -print | sort | tail -n 1)"
          if [ -z "$latest_xcode" ]; then
            latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode_15*.app' -print | sort | tail -n 1)"
          fi
          if [ -n "$latest_xcode" ]; then
            sudo xcode-select -s "$latest_xcode" || echo "xcode-select failed; using current default"
          else
            echo "No Xcode_16 or Xcode_15 bundle found; using current default"
          fi
          xcodebuild -version
          swift --version

      - name: Test KinoKit with coverage
        working-directory: Packages/KinoKit
        run: swift test --enable-code-coverage

      - name: Enforce coverage thresholds
        working-directory: Packages/KinoKit
        run: |
          set -euo pipefail

          BIN=".build/debug/KinoKitPackageTests.xctest/Contents/MacOS/KinoKitPackageTests"
          PROF=".build/debug/codecov/default.profdata"

          # Restrict the rollup to KinoKit's hand-written modules. The generated
          # KinoKitGenerated target and third-party deps (swift-openapi-runtime,
          # OpenAPIKit, ...) are excluded so the gate measures what we actually
          # own. xcrun llvm-cov report columns on the TOTAL row:
          # Regions | Missed | Region% | Functions | Missed | Function% |
          # Lines | Missed | Line% | Branches | ...
          xcrun llvm-cov report "$BIN" -instr-profile="$PROF" \
            Sources/KinoKitCore \
            Sources/KinoKitTransport \
            Sources/KinoKitAuth \
            Sources/KinoKitPlayback \
            Sources/KinoKit > coverage.txt
          cat coverage.txt

          # Line coverage % = field 10 on the TOTAL row.
          LINE_PCT="$(awk '$1 == "TOTAL" {print $10}' coverage.txt | tr -d '%')"
          echo "KinoKit module line coverage: $LINE_PCT%"
          # 50% gate — regression guard set to the floor of current reality
          # (60.7% as of M2). Tightens in M3+ when apps drive the API and
          # error-path tests become natural.
          awk -v p="$LINE_PCT" 'BEGIN { if (p + 0 < 50) exit 1 }'

          xcrun llvm-cov report "$BIN" -instr-profile="$PROF" \
            Sources/KinoKitPlayback/VariantChooser.swift > variant-chooser-coverage.txt
          cat variant-chooser-coverage.txt

          # Region coverage % = field 4 on the VariantChooser row (Swift emits
          # region counters, not branch counters; regions == "every execution
          # path was hit").
          REGION_PCT="$(awk '$1 ~ /VariantChooser.swift$/ {print $4}' variant-chooser-coverage.txt | tr -d '%')"
          echo "VariantChooser region coverage: $REGION_PCT%"
          awk -v p="$REGION_PCT" 'BEGIN { if (p + 0 < 100) exit 1 }'

  ios-build:
    name: ios-build
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' -print | sort | tail -n 1)"
          if [ -z "$latest_xcode" ]; then
            latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode_15*.app' -print | sort | tail -n 1)"
          fi
          if [ -n "$latest_xcode" ]; then
            sudo xcode-select -s "$latest_xcode" || echo "xcode-select failed; using current default"
          else
            echo "No Xcode_16 or Xcode_15 bundle found; using current default"
          fi
          xcodebuild -version
          swift --version

      - name: Build Kino-iOS
        run: xcodebuild build -workspace Kino.xcworkspace -scheme Kino-iOS -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation -quiet CODE_SIGNING_ALLOWED=NO

  tvos-build:
    name: tvos-build
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' -print | sort | tail -n 1)"
          if [ -z "$latest_xcode" ]; then
            latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode_15*.app' -print | sort | tail -n 1)"
          fi
          if [ -n "$latest_xcode" ]; then
            sudo xcode-select -s "$latest_xcode" || echo "xcode-select failed; using current default"
          else
            echo "No Xcode_16 or Xcode_15 bundle found; using current default"
          fi
          xcodebuild -version
          swift --version

      - name: Build Kino-tvOS
        run: xcodebuild build -workspace Kino.xcworkspace -scheme Kino-tvOS -destination 'generic/platform=tvOS Simulator' -skipPackagePluginValidation -quiet CODE_SIGNING_ALLOWED=NO

  macos-build:
    name: macos-build
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' -print | sort | tail -n 1)"
          if [ -z "$latest_xcode" ]; then
            latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode_15*.app' -print | sort | tail -n 1)"
          fi
          if [ -n "$latest_xcode" ]; then
            sudo xcode-select -s "$latest_xcode" || echo "xcode-select failed; using current default"
          else
            echo "No Xcode_16 or Xcode_15 bundle found; using current default"
          fi
          xcodebuild -version
          swift --version

      # macOS uses ad-hoc signing ("Sign to Run Locally", CODE_SIGN_IDENTITY=-)
      # configured in project.yml. No team or cert is needed in CI.
      - name: Build Kino-macOS
        run: xcodebuild build -workspace Kino.xcworkspace -scheme Kino-macOS -destination 'platform=macOS' -skipPackagePluginValidation -quiet

  ios-uitest:
    name: ios-uitest
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' -print | sort | tail -n 1)"
          if [ -z "$latest_xcode" ]; then
            latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode_15*.app' -print | sort | tail -n 1)"
          fi
          if [ -n "$latest_xcode" ]; then
            sudo xcode-select -s "$latest_xcode" || echo "xcode-select failed; using current default"
          else
            echo "No Xcode_16 or Xcode_15 bundle found; using current default"
          fi
          xcodebuild -version
          swift --version

      - name: Test Kino-iOS
        run: |
          # Pick the first available iPhone simulator on the runner — the GitHub
          # macos-14 image's available iPhone/iOS combinations drift between
          # image versions, so resolving by udid avoids "name=X,OS=latest" misses.
          sim_id="$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
             | select(.key | test("iOS"))
             | .value[]
             | select(.name | startswith("iPhone"))
             | .udid] | first')"
          echo "Using iOS simulator: $sim_id"
          test -n "$sim_id"
          xcodebuild test -workspace Kino.xcworkspace -scheme Kino-iOS -destination "id=$sim_id" -skipPackagePluginValidation -quiet CODE_SIGNING_ALLOWED=NO

  tvos-uitest:
    name: tvos-uitest
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' -print | sort | tail -n 1)"
          if [ -z "$latest_xcode" ]; then
            latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode_15*.app' -print | sort | tail -n 1)"
          fi
          if [ -n "$latest_xcode" ]; then
            sudo xcode-select -s "$latest_xcode" || echo "xcode-select failed; using current default"
          else
            echo "No Xcode_16 or Xcode_15 bundle found; using current default"
          fi
          xcodebuild -version
          swift --version

      - name: Test Kino-tvOS
        run: |
          sim_id="$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
             | select(.key | test("tvOS"))
             | .value[]
             | select(.name | startswith("Apple TV"))
             | .udid] | first')"
          echo "Using tvOS simulator: $sim_id"
          test -n "$sim_id"
          xcodebuild test -workspace Kino.xcworkspace -scheme Kino-tvOS -destination "id=$sim_id" -skipPackagePluginValidation -quiet CODE_SIGNING_ALLOWED=NO

  macos-uitest:
    name: macos-uitest
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' -print | sort | tail -n 1)"
          if [ -z "$latest_xcode" ]; then
            latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode_15*.app' -print | sort | tail -n 1)"
          fi
          if [ -n "$latest_xcode" ]; then
            sudo xcode-select -s "$latest_xcode" || echo "xcode-select failed; using current default"
          else
            echo "No Xcode_16 or Xcode_15 bundle found; using current default"
          fi
          xcodebuild -version
          swift --version

      # macOS uses ad-hoc signing ("Sign to Run Locally") wired in project.yml.
      # That lets the UI test runner launch on CI without an Apple Developer
      # identity, so we can run the real smoke test rather than build-for-testing.
      - name: Test Kino-macOS
        run: xcodebuild test -workspace Kino.xcworkspace -scheme Kino-macOS -destination 'platform=macOS' -skipPackagePluginValidation -quiet
