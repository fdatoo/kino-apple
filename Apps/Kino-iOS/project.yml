name: Kino-iOS
options:
  bundleIdPrefix: com.fdatoo.kino
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: 2U9Y26UJ34
    CODE_SIGN_IDENTITY: "Apple Development"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.0.1
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
packages:
  KinoKit:
    path: ../../Packages/KinoKit
targets:
  Kino-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - package: KinoKit
        product: KinoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fdatoo.kino.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Kino discovers your local server over Bonjour.
        INFOPLIST_KEY_NSBonjourServices: _kino._tcp
        CODE_SIGN_ENTITLEMENTS: Kino-iOS.entitlements
  Kino-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: Kino-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fdatoo.kino.ios.uitests
schemes:
  Kino-iOS:
    build:
      targets:
        Kino-iOS: all
        Kino-iOSUITests: [test]
    test:
      targets:
        - Kino-iOSUITests
